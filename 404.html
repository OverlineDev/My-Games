<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Not Found | OverlineDev's Game Hub</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1020;
      color: #eee;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    .container {
      max-width: 600px;
    }

    .emoji {
      font-size: 5rem;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 0.5rem;
      color: #8b7cff;
    }

    h2 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }

    p {
      color: #aaa;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .home-btn {
      display: inline-block;
      padding: 0.8rem 1.6rem;
      background: #6d4aff;
      color: #fff;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .home-btn:hover {
      background: #8b7cff;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(109, 74, 255, 0.3);
    }

    .code {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: #555;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="emoji">🎮</div>

    <h1>404</h1>
    <h2>Game not found!</h2>

    <p>
      Looks like this game wandered off into the void.
      Maybe it was removed, moved somewhere else, or the link is incorrect.
    </p>

    <a class="home-btn" href="/My-Games/">
      ← Back to Game Hub
    </a>

    <div class="code">
      OverlineDev's Game Hub
    </div>
  </main>
</body>
</html>
